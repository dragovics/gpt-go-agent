name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: true
      - name: Test
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Build Linux artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w -X github.com/dragovics/gpt-go-agent/internal/config.Version=${VERSION}" -o "dist/gpt-go-agent_linux_${arch}" ./cmd/gpt-go-agent
          done
          sha256sum dist/* > dist/SHA256SUMS
          tar -C dist -czf "dist/gpt-go-agent_${VERSION}_linux_amd64.tar.gz" gpt-go-agent_linux_amd64
          tar -C dist -czf "dist/gpt-go-agent_${VERSION}_linux_arm64.tar.gz" gpt-go-agent_linux_arm64
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/gpt-go-agent_"$VERSION"_linux_*.tar.gz dist/SHA256SUMS --generate-notes --verify-tag
