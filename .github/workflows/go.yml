name: go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -cover ./...
      - run: go build ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: 2026.1
          install-go: false

      - name: Gosec
        uses: securego/gosec@v2.29.0
        with:
          args: './...'

      - name: Govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: '1.26'
          go-package: './...'
