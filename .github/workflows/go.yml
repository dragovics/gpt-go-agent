name: go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: true
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -cover ./...
      - run: go build ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: 2026.1
          install-go: false

      - name: Gosec
        uses: securego/gosec@v2.29.0
        with:
          args: './...'

      - name: Govulncheck
        run: |
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
